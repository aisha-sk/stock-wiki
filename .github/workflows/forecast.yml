name: Daily forecast

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-finbert
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r ml/requirements.txt
      # Exits non-zero when the validator fails, so nothing below runs and nothing is committed.
      - run: python -m ml.pipeline --tickers TSLA NVDA AAPL --out data/artifacts --no-train
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - run: python scripts/validate_contracts.py data/artifacts
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artifacts
          git diff --cached --quiet && exit 0
          git commit -m "data: daily forecast"
          git pull --rebase origin main
          git push origin HEAD:main
