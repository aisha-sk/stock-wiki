name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install "jsonschema[format]"
      - name: Example fixtures match the contract
        run: python scripts/validate_contracts.py
      - name: Published artifacts match the contract
        if: hashFiles('data/artifacts/tickers.json') != ''
        run: python scripts/validate_contracts.py data/artifacts

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  ml:
    name: ML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      # A light set: everything the fast tests import. torch, transformers and mlflow are
      # imported lazily by the pipeline and only needed for the tests marked slow.
      - run: >
          pip install pandas numpy scikit-learn xgboost yfinance pandas_market_calendars
          pyyaml "jsonschema[format]" pyarrow feedparser requests pytest ruff
      - run: ruff check ml
      - run: pytest ml -m "not slow" -q
